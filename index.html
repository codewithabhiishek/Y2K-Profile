<title>PROFILE.EXE</title>
<style>
/* ================================================================
   PROFILE.EXE — self-contained Y2K GitHub profile toolkit.
   The entire app lives in this file: no build step, no modules,
   no external JS. Themes are data; every surface reads CSS vars.

   HARD RULE: no "<" may ever appear inside the script regions of
   this document (some delivery proxies strip tag-shaped sequences
   from inline scripts). Real tags in HTML strings are written as
   \x3c… inside executable scripts, and the main app block below is
   stored inert (type="text/plain") with every "<" written as «,
   then decoded and executed by the tiny loader at the bottom.
   ================================================================ */
:root{
  --t-bg:#030a05; --t-deep:#010502; --t-panel:#07130a; --t-panel2:#0b1e10;
  --t-ink:#d8ffe4; --t-muted:#5f8f6f; --t-line:#1c4a2e; --t-hi:#2f7a4c; --t-lo:#04110a;
  --t-pri:#00ff66; --t-sec:#7dffa8; --t-acc:#d4ff3f; --t-scan:.13; --t-rad:2px;
  --f-px:'Press Start 2P',monospace; --f-crt:'VT323',monospace;
  --f-ui:'Chakra Petch',sans-serif; --f-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--t-line) var(--t-deep)}
body{
  margin:0; min-height:100vh; color:var(--t-ink); font-family:var(--f-ui);
  background-color:var(--t-deep);
  background-image:
    linear-gradient(color-mix(in srgb,var(--t-line) 26%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--t-line) 26%,transparent) 1px,transparent 1px);
  background-size:42px 42px;
  transition:background-color .35s ease,color .35s ease;
}
::selection{background:var(--t-pri);color:var(--t-deep)}
button{font-family:inherit}

/* ---------- CRT atmosphere (optimized for zero lag) ---------- */
.crt-scan{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.03;
  background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 2px)}
.crt-vig,.crt-flick,.stars{display:none !important}

/* ---------- surfaces ---------- */
.sf-bevel{border:2px solid;border-color:var(--t-hi) var(--t-lo) var(--t-lo) var(--t-hi);background:var(--t-panel);border-radius:var(--t-rad)}
.sf-inset{border:2px solid;border-color:var(--t-lo) var(--t-hi) var(--t-hi) var(--t-lo);background:color-mix(in srgb,var(--t-deep) 72%,var(--t-panel));border-radius:var(--t-rad)}
.sf-pixel{border:2px solid var(--t-line);background:var(--t-panel);box-shadow:0 0 0 2px var(--t-deep),0 0 0 4px var(--t-line),inset 0 0 0 2px var(--t-deep)}
.sf-glow{border:1px solid color-mix(in srgb,var(--t-pri) 60%,transparent);background:var(--t-panel);box-shadow:0 0 14px color-mix(in srgb,var(--t-pri) 22%,transparent),inset 0 0 14px color-mix(in srgb,var(--t-pri) 8%,transparent)}
.sf-grid{border:1px solid var(--t-line);background-color:var(--t-panel);
  background-image:linear-gradient(color-mix(in srgb,var(--t-line) 35%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--t-line) 35%,transparent) 1px,transparent 1px);background-size:22px 22px}
.sf-scan{border:1px solid var(--t-line);background:var(--t-panel);position:relative}
.sf-scan::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 4px)}

.win{position:relative}
.win-h{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.5rem .75rem;border-bottom:1px solid var(--t-line);background:var(--t-panel2)}
.win-t{display:flex;align-items:center;gap:.5rem;min-width:0}
.win-t h2{margin:0;font-family:var(--f-px);font-size:10px;letter-spacing:.12em;color:var(--t-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;display:inline-block}
.win-b{position:relative}

/* ---------- controls ---------- */
.btn{font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;user-select:none;
  border:2px solid;border-color:var(--t-hi) var(--t-lo) var(--t-lo) var(--t-hi);
  background:linear-gradient(180deg,var(--t-panel2),var(--t-panel));color:var(--t-ink);
  padding:.45rem .85rem;font-size:.75rem;border-radius:var(--t-rad);
  transition:transform .06s ease,filter .15s ease,box-shadow .15s ease;display:inline-flex;align-items:center;gap:.4rem;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.25);box-shadow:0 0 12px color-mix(in srgb,var(--t-pri) 30%,transparent)}
.btn:active{transform:translate(1px,1px);border-color:var(--t-lo) var(--t-hi) var(--t-hi) var(--t-lo)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}
.btn-pri{background:linear-gradient(180deg,color-mix(in srgb,var(--t-pri) 92%,white),var(--t-pri));color:var(--t-deep);
  border-color:color-mix(in srgb,var(--t-pri) 65%,white) color-mix(in srgb,var(--t-pri) 55%,black) color-mix(in srgb,var(--t-pri) 55%,black) color-mix(in srgb,var(--t-pri) 65%,white)}
.btn-pri:hover{box-shadow:0 0 18px color-mix(in srgb,var(--t-pri) 55%,transparent)}
.btn-sm{padding:.28rem .55rem;font-size:.65rem;letter-spacing:.05em}
.inp{font-family:var(--f-mono);background:color-mix(in srgb,var(--t-deep) 80%,var(--t-panel));
  border:2px solid;border-color:var(--t-lo) var(--t-hi) var(--t-hi) var(--t-lo);color:var(--t-pri);
  padding:.55rem .8rem;font-size:.9rem;outline:none;width:100%;border-radius:var(--t-rad);transition:box-shadow .2s}
.inp:focus{box-shadow:0 0 0 1px var(--t-pri),0 0 16px color-mix(in srgb,var(--t-pri) 35%,transparent)}
.inp::placeholder{color:color-mix(in srgb,var(--t-muted) 75%,transparent)}
select.inp{color:var(--t-ink)}
.led{width:8px;height:8px;border-radius:999px;display:inline-block;box-shadow:0 0 8px currentColor;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.blink{animation:blk 1.1s steps(1) infinite}
@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:0}}
.glow-txt{text-shadow:0 0 8px color-mix(in srgb,var(--t-pri) 80%,transparent),0 0 26px color-mix(in srgb,var(--t-pri) 40%,transparent)}

/* ---------- header / ticker / tabs ---------- */
.hdr{position:sticky;top:0;z-index:60;border-bottom:2px solid var(--t-line);background:var(--t-deep)}
.hdr-in{max-width:1440px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:.85rem;flex-wrap:wrap}
.logo-t{font-family:var(--f-px);font-size:1.05rem;letter-spacing:.08em;color:var(--t-pri);line-height:1;margin:0}
.logo-s{font-family:var(--f-mono);font-size:10px;color:var(--t-muted);margin:3px 0 0;white-space:nowrap}
.chip-group{display:flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid var(--t-line);background:color-mix(in srgb,var(--t-deep) 70%,var(--t-panel));border-radius:var(--t-rad);max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip-group::-webkit-scrollbar{display:none}
.chip{display:inline-flex;gap:2.5px;padding:5px 6px;border:1px solid var(--t-line);background:var(--t-panel);cursor:pointer;border-radius:2px;min-height:28px;touch-action:manipulation;transition:transform .12s ease,box-shadow .15s ease,border-color .15s}
.chip i{width:9px;height:9px;display:inline-block;border-radius:1px}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.5);border-color:var(--t-pri)}
.chip.on{border-color:var(--t-pri);box-shadow:0 0 12px color-mix(in srgb,var(--t-pri) 45%,transparent)}
.ticker{overflow:hidden;border-top:1px solid var(--t-line);border-bottom:1px solid var(--t-line);background:color-mix(in srgb,var(--t-deep) 90%,black);user-select:none;display:flex;width:100%}
.ticker-in{display:flex;flex-shrink:0;width:max-content;white-space:nowrap;font-family:var(--f-crt);font-size:16px;line-height:1.4;color:var(--t-sec);padding:4px 0;animation:tickermove 35s linear infinite;will-change:transform}
.ticker:hover .ticker-in{animation-play-state:paused}
.ticker-in span{display:inline-flex;align-items:center;flex-shrink:0;padding:0 1rem;letter-spacing:.05em}
@keyframes tickermove{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-50%,0,0)}}

.built-by{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--f-ui);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--t-pri);text-decoration:none;padding:3px 10px;border-radius:var(--t-rad);border:1px solid color-mix(in srgb,var(--t-pri) 40%,transparent);background:color-mix(in srgb,var(--t-panel2) 60%,transparent);animation:built-glow 2.4s ease-in-out infinite alternate;transition:all .2s cubic-bezier(.2,.8,.3,1);touch-action:manipulation}
.built-by:hover{transform:translateY(-1px) scale(1.04);color:var(--t-acc);border-color:var(--t-acc);box-shadow:0 0 14px color-mix(in srgb,var(--t-acc) 60%,transparent)}
@keyframes built-glow{0%{text-shadow:0 0 4px color-mix(in srgb,var(--t-pri) 40%,transparent);box-shadow:0 0 4px color-mix(in srgb,var(--t-pri) 20%,transparent);border-color:color-mix(in srgb,var(--t-pri) 35%,transparent)}50%{text-shadow:0 0 12px var(--t-pri),0 0 20px var(--t-sec);box-shadow:0 0 10px color-mix(in srgb,var(--t-pri) 45%,transparent);border-color:var(--t-pri);color:var(--t-sec)}100%{text-shadow:0 0 5px color-mix(in srgb,var(--t-pri) 50%,transparent);box-shadow:0 0 5px color-mix(in srgb,var(--t-pri) 25%,transparent);border-color:color-mix(in srgb,var(--t-pri) 40%,transparent)}}

.tabs{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 1.25rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{text-align:center;background:transparent;border:none;border-top:3px solid transparent;cursor:pointer;
  padding:.65rem .75rem .55rem;opacity:.75;transition:opacity .12s,background .15s;width:100%;border-radius:var(--t-rad) var(--t-rad) 0 0;touch-action:manipulation}
.tab:hover{opacity:1;background:color-mix(in srgb,var(--t-panel) 50%,transparent)}
.tab.on{opacity:1;background:var(--t-panel);border-top-color:var(--t-pri);border-left:1px solid var(--t-line);border-right:1px solid var(--t-line)}
.tab b{display:flex;align-items:center;justify-content:center;gap:.45rem;font-family:var(--f-ui);font-weight:700;font-size:11.5px;letter-spacing:.12em;color:var(--t-ink)}
.tab.on b{color:var(--t-pri)}
.tab span{display:block;font-family:var(--f-mono);font-size:9.5px;color:var(--t-muted);margin-top:3px}
.tab.on span{color:var(--t-sec)}

main{max-width:1440px;width:100%;margin:0 auto;padding:1.25rem 1.25rem 4.75rem;box-sizing:border-box}
.pane{transform:translateZ(0)}
.sbar{position:fixed;bottom:0;left:0;right:0;z-index:60;border-top:1px solid var(--t-line);background:color-mix(in srgb,var(--t-deep) 94%,black);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sbar-in{width:100%;max-width:100%;box-sizing:border-box;margin:0 auto;padding:.45rem 1.5rem;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-mono);font-size:10.5px;color:var(--t-muted);white-space:nowrap;gap:.5rem}

/* ---------- layouts & cards ---------- */
.grid2{display:grid;gap:1.25rem;grid-template-columns:minmax(0, 420px) minmax(0, 1fr);align-items:stretch;min-width:0;width:100%;box-sizing:border-box}
.grid2b{grid-template-columns:minmax(0, 330px) minmax(0, 1fr)}
.grid2 > *, .grid2b > *, .stack{min-width:0;max-width:100%;box-sizing:border-box}
.stack{display:flex;flex-direction:column;gap:.85rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;min-width:0;max-width:100%}
.lbl{font-family:var(--f-ui);font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t-muted)}
.note{font-family:var(--f-mono);font-size:10.5px;line-height:1.6;color:var(--t-muted);overflow-wrap:anywhere}
.logbox{height:6.5rem;overflow-y:auto;padding:.5rem .7rem;font-family:var(--f-mono);font-size:11px;line-height:1.55;color:var(--t-sec);overflow-wrap:anywhere}
.errbox{padding:.55rem .75rem;font-family:var(--f-mono);font-size:11px;line-height:1.55;color:var(--t-acc);border:1px dashed var(--t-acc);background:color-mix(in srgb,var(--t-acc) 8%,transparent);overflow-wrap:anywhere}

.tone{flex:1;text-align:left;padding:.55rem .7rem;border:1px solid var(--t-line);background:transparent;cursor:pointer;transition:all .15s;border-radius:var(--t-rad);min-width:0;touch-action:manipulation}
.tone:hover{border-color:var(--t-sec);transform:translateX(2px);background:color-mix(in srgb,var(--t-panel) 60%,transparent)}
.tone.on{border-color:var(--t-pri);background:var(--t-panel2);box-shadow:0 0 12px color-mix(in srgb,var(--t-pri) 25%,transparent)}
.tone b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:var(--t-ink)}
.tone.on b{color:var(--t-pri)}
.tone span{display:block;font-family:var(--f-mono);font-size:9px;color:var(--t-muted);margin-top:2px;line-height:1.35}

.tplrow{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.tplbtn{display:block;width:100%;text-align:left;padding:.6rem .75rem;border:1px solid var(--t-line);background:transparent;cursor:pointer;transition:all .15s;border-radius:var(--t-rad);box-sizing:border-box;touch-action:manipulation}
.tplbtn:hover{border-color:var(--t-sec);transform:translateX(3px);background:color-mix(in srgb,var(--t-panel) 60%,transparent)}
.tplbtn.on{border-color:var(--t-pri);background:var(--t-panel2);box-shadow:0 0 12px color-mix(in srgb,var(--t-pri) 20%,transparent)}
.tplbtn b{display:flex;align-items:center;gap:.5rem;font-family:var(--f-ui);font-size:11.5px;letter-spacing:.08em;color:var(--t-ink)}
.tplbtn.on b{color:var(--t-pri)}
.tplbtn span{display:block;font-family:var(--f-mono);font-size:9.5px;color:var(--t-muted);margin-top:2px;line-height:1.45}

.seg{display:inline-flex;border:1px solid var(--t-line);border-radius:var(--t-rad);overflow:hidden;flex-shrink:0}
.seg button{border:none;background:transparent;color:var(--t-muted);font-family:var(--f-px);font-size:8px;padding:6px 9px;cursor:pointer;transition:all .12s;touch-action:manipulation}
.seg button:hover{color:var(--t-ink);background:color-mix(in srgb,var(--t-panel) 80%,transparent)}
.seg button.on{background:var(--t-pri);color:var(--t-deep);font-weight:bold}

.svgwrap{position:relative;padding:.55rem .75rem;display:flex;justify-content:center;align-items:center;overflow:hidden;width:100%;min-height:105px;max-height:165px;background:color-mix(in srgb,var(--t-deep) 90%,black);border:1px solid transparent;border-radius:var(--t-rad);box-sizing:border-box;cursor:zoom-in;transition:border-color .15s ease,box-shadow .2s ease;touch-action:manipulation}
.svgwrap:hover{border-color:var(--t-pri);box-shadow:0 0 16px color-mix(in srgb,var(--t-pri) 30%,transparent),inset 0 0 12px color-mix(in srgb,var(--t-pri) 12%,transparent)}
.svgwrap:hover::after{content:"⛶ CLICK TO ZOOM";position:absolute;bottom:6px;right:8px;font-family:var(--f-px);font-size:7.5px;line-height:1;letter-spacing:.08em;color:var(--t-pri);background:color-mix(in srgb,var(--t-panel2) 90%,black);padding:3px 6px;border:1px solid var(--t-pri);border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none;animation:fadeIn .15s ease}
.svgwrap svg{max-width:100%;max-height:150px;width:auto;height:auto;display:block;box-shadow:0 6px 20px rgba(0,0,0,.65);border-radius:2px;object-fit:contain;transition:transform .18s ease}
.svgwrap:hover svg{transform:scale(1.025)}
.svgwrap.svgwrap-tall{min-height:260px;max-height:480px;padding:.75rem 1rem}
.svgwrap.svgwrap-tall svg{max-height:450px;max-width:100%;width:auto;height:auto}
.embed{font-family:var(--f-mono);font-size:9.5px;color:var(--t-muted);padding:.35rem .55rem;white-space:nowrap;overflow-x:auto;background:color-mix(in srgb,var(--t-deep) 80%,var(--t-panel));border-top:1px solid var(--t-line);box-sizing:border-box}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:1rem;box-sizing:border-box;animation:modalFadeIn .15s ease-out}
.modal-card{width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 0 40px color-mix(in srgb,var(--t-pri) 40%,transparent),0 16px 50px rgba(0,0,0,.9);border:2px solid var(--t-pri);border-radius:var(--t-rad);overflow:hidden;animation:modalPop .18s cubic-bezier(.16,1,.3,1)}
.modal-body{padding:1.25rem;display:flex;justify-content:center;align-items:center;background:color-mix(in srgb,var(--t-deep) 94%,black);overflow:auto;flex:1}
.modal-svg-wrap{display:flex;justify-content:center;align-items:center;width:100%}
.modal-svg-wrap svg{max-width:100%;max-height:62vh;width:auto;height:auto;display:block;box-shadow:0 12px 40px rgba(0,0,0,.8);border-radius:2px}
@keyframes modalFadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ---------- tech stack customizer ---------- */
.skill-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:300px;overflow-y:auto;padding:.6rem;background:color-mix(in srgb,var(--t-deep) 90%,black);border:1px solid var(--t-line);border-radius:var(--t-rad);box-sizing:border-box;-webkit-overflow-scrolling:touch}
.skill-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;font-family:var(--f-mono);font-size:10px;color:var(--t-sec);background:color-mix(in srgb,var(--t-panel2) 80%,transparent);border:1px solid var(--t-line);border-radius:2px;cursor:pointer;user-select:none;touch-action:manipulation;transition:all .12s ease}
.skill-chip:hover{color:var(--t-ink);border-color:var(--t-pri);background:color-mix(in srgb,var(--t-pri) 15%,transparent)}
.skill-chip.on{color:var(--t-deep);background:var(--t-pri);border-color:var(--t-pri);font-weight:bold;box-shadow:0 0 8px color-mix(in srgb,var(--t-pri) 40%,transparent)}
.skill-cat-lbl{width:100%;font-family:var(--f-ui);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--t-muted);margin:.55rem 0 .25rem;padding-left:2px;border-bottom:1px dashed var(--t-line);padding-bottom:2px}
.skill-cat-lbl:first-child{margin-top:0}
.skill-preview{padding:.6rem .75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--t-deep) 94%,black);border-radius:var(--t-rad);border:1px solid var(--t-line);min-height:56px;overflow-x:auto;box-sizing:border-box}
.skill-preview img{max-width:100%;height:auto;object-fit:contain}

.output{flex:1;min-height:640px;display:flex;flex-direction:column;min-width:0;max-width:100%;box-sizing:border-box}

var GH="https://api.github.com";
function ghHeaders(){var h={Accept:"application/vnd.github+json"};var tk=store.get("px_ghtoken");if(tk)h.Authorization="Bearer "+tk;return h;}
function gh(path){return fetch(GH+path,{headers:ghHeaders()}).then(function(r){
  if(r.status===404)throw new Error("That username does not exist on GitHub (404). Check the spelling.");
  if(r.status===403||r.status===429)throw new Error("GitHub rate limit hit (60/hr unauthenticated). Add a token in the key panel, wait a bit, or USE DEMO DATA.");
  if(!r.ok)throw new Error("GitHub returned HTTP "+r.status+".");
  return r.json();});}
function fetchProfile(u){
  u=u.trim().replace(/^@/,"");if(!u)return Promise.reject(new Error("Type a GitHub handle first."));
  return gh("/users/"+encodeURIComponent(u)).then(function(basic){
    return Promise.all([gh("/users/"+encodeURIComponent(u)+"/repos?sort=stars&per_page=8&direction=desc").catch(function(){return[];}),
      gh("/users/"+encodeURIComponent(u)+"/events/public?per_page=100").catch(function(){return[];})])
    .then(function(arr){
      var repos=arr[0],events=arr[1];
      var lc={},stars=0;
      var rl=repos.filter(function(r){return!r.fork;}).slice(0,6).map(function(r){stars+=r.stargazers_count||0;
        if(r.language)lc[r.language]=(lc[r.language]||0)+1+(r.stargazers_count||0)/50;
        return{name:r.name,desc:r.description||"",stars:r.stargazers_count||0,lang:r.language||"?",topics:(r.topics||[]).slice(0,4),url:r.html_url};});
      var langs=Object.keys(lc).map(function(k){return[k,lc[k]];}).sort(function(a,b){return b[1]-a[1];});
      var tot=langs.reduce(function(s,l){return s+l[1];},0)||1;
      langs=langs.slice(0,6).map(function(l){return[l[0],Math.round(l[1]/tot*100)];});
      if(!langs.length)langs=[["Generalist",100]];
      var days={};events.forEach(function(e){var d=(e.created_at||"").slice(0,10);if(d)days[d]=(days[d]||0)+1;});
      var keys=Object.keys(days).sort();var cur=0,best=0,run=0,prev=null;
      keys.forEach(function(d){var dt=new Date(d+"T12:00:00Z");
        if(prev&&(dt-prev)===86400000)run++;else run=1;prev=dt;if(run>best)best=run;});
      var today=new Date();today.setHours(12,0,0,0);
      var check=new Date(today);run=0;
      for(var back=0;back«400;back++){var iso=check.toISOString().slice(0,10);
        if(days[iso]){run++;cur=run;check=new Date(check.getTime()-86400000);}
        else if(back===0){check=new Date(check.getTime()-86400000);}
        else break;}
      var grid=[],pat=[0,1,2,0,3,1,0,0,2,4,1,0,1,0];
      for(var g=0;g«84;g++){var dtk=new Date(today.getTime()-(83-g)*86400000).toISOString().slice(0,10);
        grid.push(days[dtk]!==undefined?Math.min(4,days[dtk]):pat[g%14]);}
      return{isDemo:false,username:basic.login,name:basic.name||basic.login,location:basic.location||"—",
        bio:basic.bio||"—",followers:basic.followers||0,following:basic.following||0,publicRepos:basic.public_repos||0,
        stars:stars,joined:(basic.created_at||"").slice(0,4)||"2020",avatarUrl:basic.avatar_url||"",
        langs:langs,streak:best||cur||1,currentStreak:cur||0,activeMonth:"RECENT",repos:rl,grid:grid};
    });});}

  }).then(function(res){
    return res.json().then(function(data){

      }
      return data.markdown;
    }).catch(function(e){

    });
  });
}

function cleanName(n){
  if(!n)return "";
  return n.replace(/[\u{1F300}-\u{1FAFF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/gu, "")
          .replace(/[^\x20-\x7E]/g, "")
          .trim();
}

function interpolateTemplate(rawMd){
  var p=S.profile||DEMO;
  var u=p.username;
  var n=cleanName(p.name)||u;
  var nUpper=n.toUpperCase();
  var loc=p.location&&p.location!=="—"?p.location.replace(/[,;]/g, " "):"Earth";
  var nEnc=encodeURIComponent(nUpper);
  var locEnc=encodeURIComponent(loc);
  var skillsList = (S.skills && S.skills.length > 0) ? S.skills.join(",") : "js,ts,react,nextjs,nodejs,tailwind,python,fastapi,postgres,docker,git,linux";

  var mainProj = (p.repos && p.repos[0] && p.repos[0].name) || "Y2K-Profile";
  var locPlus = loc.replace(/\s+/g, "+");
  var nPlus = nUpper.replace(/\s+/g, "+");

  var res = rawMd
    .replace(/https:\/\/skillicons\.dev\/icons\?i=[a-zA-Z0-9_,+-]+/g, "https://skillicons.dev/icons?i=" + skillsList)
    .replace(/\[YOUR%20NAME\]/gi, nEnc)
    .replace(/\[YOUR\+NAME\]/gi, nPlus)
    .replace(/\[YOUR NAME\]/gi, nUpper)
    .replace(/\[Your Name\]/g, n)
    .replace(/\[YOUR%20LOCATION\]/gi, locEnc)
    .replace(/\[YOUR\+LOCATION\]/gi, locPlus)
    .replace(/\[YOUR LOCATION\]/gi, loc)
    .replace(/\[Your Location\]/g, loc)
    .replace(/\[YOUR-USERNAME\]/gi, u)
    .replace(/\[YOUR_USERNAME\]/gi, u)
    .replace(/\[YOUR_SPOTIFY_ID\]/gi, u)
    .replace(/\[Your Handle\]/g, "@"+u)
    .replace(/\[YOUR HANDLE\]/g, "@"+u)
    .replace(/\[Your Email\]/g, u.toLowerCase()+"@developer.mail")
    .replace(/\[YOUR EMAIL\]/g, u.toUpperCase()+"@DEVELOPER.MAIL")
    .replace(/\[Your Website\]/g, "https://github.com/"+u)
    .replace(/\[YOUR WEBSITE\]/g, "https://github.com/"+u)
    .replace(/\[Your Twitter Handle\]/g, u)
    .replace(/\[YOUR TWITTER\]/g, u)
    .replace(/\[Main Project\]/g, mainProj);
  return res;
}

function compile(){

      document.body.appendChild(el);

  run();
})();
</script>
